name: ci

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: exists
        run: echo "yes=${{ hashFiles('pipeline/Cargo.toml') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.yes == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: steps.exists.outputs.yes == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline
      - name: format
        if: steps.exists.outputs.yes == 'true'
        working-directory: pipeline
        run: cargo fmt --check
      - name: clippy
        if: steps.exists.outputs.yes == 'true'
        working-directory: pipeline
        run: cargo clippy --locked --all-targets -- -D warnings
      # Hors ligne et sans jeton, conformément à docs/tdd.md.
      - name: tests
        if: steps.exists.outputs.yes == 'true'
        working-directory: pipeline
        run: cargo test --locked
      # rayon est exclu du chemin déterministe par l'ADR 0001 (§1.6).
      # ndarray-linalg est exclu nommément (§1.8).
      - name: dépendances interdites
        if: steps.exists.outputs.yes == 'true'
        working-directory: pipeline
        run: |
          if grep -qE '^(rayon|ndarray-linalg)\b' Cargo.lock; then
            echo "::error::dépendance exclue par docs/adr/0001-stack.md présente dans Cargo.lock"
            grep -nE '^(rayon|ndarray-linalg)\b' Cargo.lock
            exit 1
          fi

  web:
    name: front (react/ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: exists
        run: echo "yes=${{ hashFiles('web/package.json') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.yes == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.exists.outputs.yes == 'true'
        working-directory: web
        run: npm ci
      - name: types
        if: steps.exists.outputs.yes == 'true'
        working-directory: web
        run: npx tsc --noEmit
      - name: tests
        if: steps.exists.outputs.yes == 'true'
        working-directory: web
        run: npm test --if-present
      - name: build
        if: steps.exists.outputs.yes == 'true'
        working-directory: web
        run: npm run build

  artefacts:
    name: artefacts et schémas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Le contrat pipeline <-> front est vérifié en CI et non à la compilation
      # (ADR 0001, §6 « ce que cette recommandation concède »).
      - name: valider les artefacts contre schemas/
        run: |
          shopt -s globstar nullglob
          echec=0
          associer() {
            case "$1" in
              public/api/index.json)          echo schemas/manifeste-1.schema.json ;;
              public/api/instantanes/*.json)  echo schemas/instantane-1.schema.json ;;
              public/api/preuves/*.json)      echo schemas/eclat-preuves-1.schema.json ;;
              data/registre/partis.json)      echo schemas/registre-partis-1.schema.json ;;
              *) echo "" ;;
            esac
          }
          # nullglob n'élimine que les motifs à joker : un chemin littéral
          # absent resterait dans la liste. On filtre sur l'existence.
          candidats=(public/api/**/*.json data/registre/partis.json)
          artefacts=()
          for c in "${candidats[@]}"; do
            [ -f "$c" ] && artefacts+=("$c")
          done
          if [ ${#artefacts[@]} -eq 0 ]; then
            echo "aucun artefact produit pour l'instant"
          fi
          for a in "${artefacts[@]}"; do
            s=$(associer "$a")
            if [ -z "$s" ]; then
              echo "::error file=$a::artefact sans schéma associé — ajouter le schéma ou la correspondance dans ci.yml"
              echec=1; continue
            fi
            if [ ! -f "$s" ]; then
              echo "::error file=$a::schéma $s absent"
              echec=1; continue
            fi
            echo "::group::$a contre $s"
            # -r resout les $ref inter-fichiers : manifeste-1 et instantane-1
            # referencent des $defs de preuve-1. Sans lui la validation echoue.
            npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=true \
              -r schemas/preuve-1.schema.json -s "$s" -d "$a" || echec=1
            echo "::endgroup::"
          done
          # Le registre de preuves est du JSONL : une ligne, un document.
          if [ -f data/preuves/positions.jsonl ] && [ -f schemas/preuve-1.schema.json ]; then
            n=0
            while IFS= read -r ligne; do
              n=$((n+1))
              printf '%s' "$ligne" > /tmp/ligne.json
              npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=true \
                -s schemas/preuve-1.schema.json -d /tmp/ligne.json >/dev/null \
                || { echo "::error file=data/preuves/positions.jsonl,line=$n::ligne invalide"; echec=1; }
            done < data/preuves/positions.jsonl
            echo "$n lignes de preuve validées"
          fi
          exit $echec

  garde-fous:
    name: garde-fous méthode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Liste canonique dans scripts/lexique.sh — jamais recopiée ailleurs.
      # docs/juridique.md interdit tout axe à pôle dépréciatif, y compris en
      # interne : un simple nom de champ suffirait à créer la métrique.
      - name: lexique (code et données)
        run: ./scripts/lexique.sh code
      - name: lexique (documentation)
        run: ./scripts/lexique.sh docs
      # securite.sh n'était lancé que par le crochet local, en mode index. Un
      # défaut latent est donc passé sur develop, et quiconque n'a pas posé
      # core.hooksPath committait sans aucun contrôle. En CI, sur l'arbre entier.
      - name: sécurité (arbre entier)
        run: ./scripts/securite.sh --arbre
      # Niveau 1 : hors ligne, sans clé, sans jeton (plan-de-tests.md §2).
      - name: tests de la récupération
        run: ./scripts/test-recuperer-sources.sh

  # Portes déclarées bloquantes par la documentation et vérifiables sans le
  # binaire du pipeline. Recensement : docs/brique0/plan-de-tests.md §15.
  portes:
    name: portes déclarées
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # plan-de-tests.md §15 porte 1 — la liste nominative des invariants.
      - name: identifiants de test déclarés contre suites écrites
        run: ./scripts/portes-de-ci.sh identifiants
      # contrats.md §6 — I12 (agrégation inter-familles) et I13 (coordonnée
      # individuelle). Les deux sont énoncés comme mécaniques dans le contrat.
      - name: invariants mécaniques du contrat de sortie
        run: ./scripts/portes-de-ci.sh invariants
      # plan-de-tests.md §15, portes non chiffrées.
      - name: tests sautés sans date de reprise
        run: ./scripts/portes-de-ci.sh tests-ignores

  # Squelettes. Ces portes sont déclarées bloquantes et ne peuvent PAS être
  # vérifiées aujourd'hui : elles portent sur du code et des artefacts qui
  # n'existent pas. Les trois contrôles de déterminisme exigent le binaire
  # `contrepoint` et les seuils de couverture visent `matrice` et `estimateur` :
  # la garde suit donc `pipeline/src/main.rs`, et non `pipeline/Cargo.toml`, qui
  # existe depuis le cycle 0 des adaptateurs. Le travail porte la commande exacte
  # qu'il exécutera — une porte qui saute en le disant vaut mieux qu'une porte
  # déclarée sans travail en face.
  couverture-et-determinisme:
    name: couverture et déterminisme (squelette)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: exists
        run: echo "yes=${{ hashFiles('pipeline/src/main.rs') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.yes == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - if: steps.exists.outputs.yes == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline
      # cargo-llvm-cov est un outil de CI, pas une dépendance du produit : il
      # n'entre pas dans Cargo.lock (plan-de-tests.md §3).
      - name: outil de couverture
        if: steps.exists.outputs.yes == 'true'
        run: cargo install cargo-llvm-cov --locked
      # plan-de-tests.md §15 portes 2 et 3 : branches ≥ 90 % sur `matrice` et
      # `estimateur`, lignes ≥ 70 % sur le binaire. Le seuil de 90 % est marqué
      # `A VERIFIER` au §17 : mesurer au cycle 5, et si le chiffre est
      # inatteignable c'est le chiffre qui change avec son motif, pas la porte.
      - name: couverture
        if: steps.exists.outputs.yes == 'true'
        working-directory: pipeline
        run: |
          cargo llvm-cov --locked --branch --json --output-path /tmp/couverture.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/couverture.json"))
          echec = 0
          for f in d["data"][0]["files"]:
              if "/matrice" in f["filename"] or "/estimateur" in f["filename"]:
                  b = f["summary"]["branches"]
                  if b["count"] and b["percent"] < 90:
                      print(f"::error::porte 2 — {f['filename']} : "
                            f"{b['percent']:.1f} % de branches, plancher 90 %")
                      echec = 1
          t = d["data"][0]["totals"]["lines"]["percent"]
          if t < 70:
              print(f"::error::porte 3 — {t:.1f} % de lignes, plancher 70 %")
              echec = 1
          sys.exit(echec)
          PY
      # contrats.md §8.2 — les trois contrôles de non-régression du déterminisme.
      # Repris mot pour mot du contrat : idempotence, isolement de l'horloge,
      # ajout seul. Ils exigent le binaire `contrepoint`, qui n'existe pas.
      - name: déterminisme — les trois contrôles du contrat
        if: steps.exists.outputs.yes == 'true'
        working-directory: pipeline
        run: |
          set -euo pipefail
          cargo build --locked --release
          bin=target/release/contrepoint
          D=2026-08-27T00:00:00Z
          # 1. Idempotence — même entrée, même date injectée, même octet.
          CONTREPOINT_DATE_CALCUL=$D "$bin" construire --sortie /tmp/a
          CONTREPOINT_DATE_CALCUL=$D "$bin" construire --sortie /tmp/b
          diff -r /tmp/a /tmp/b
          # 2. Isolement de l'horloge — seule la date de calcul bouge.
          CONTREPOINT_DATE_CALCUL=2027-01-01T00:00:00Z "$bin" construire --sortie /tmp/c
          "$bin" diff-hors-date_calcul /tmp/a /tmp/c
          # 3. Ajout seul — l'existant est un préfixe octet pour octet du nouveau.
          if [ -f ../data/preuves/positions.jsonl ]; then
            head -c "$(stat -c%s ../data/preuves/positions.jsonl)" /tmp/a/positions.jsonl \
              | cmp - ../data/preuves/positions.jsonl
          fi

  ci-ok:
    name: ci-ok
    if: always()
    needs: [pipeline, web, artefacts, garde-fous, portes, couverture-et-determinisme]
    runs-on: ubuntu-latest
    steps:
      - name: verdict
        run: |
          echo "pipeline=${{ needs.pipeline.result }}"
          echo "web=${{ needs.web.result }}"
          echo "artefacts=${{ needs.artefacts.result }}"
          echo "garde-fous=${{ needs.garde-fous.result }}"
          echo "portes=${{ needs.portes.result }}"
          echo "couverture-et-determinisme=${{ needs['couverture-et-determinisme'].result }}"
          for r in "${{ needs.pipeline.result }}" "${{ needs.web.result }}" \
                   "${{ needs.artefacts.result }}" "${{ needs.garde-fous.result }}" \
                   "${{ needs.portes.result }}" \
                   "${{ needs['couverture-et-determinisme'].result }}"; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done
