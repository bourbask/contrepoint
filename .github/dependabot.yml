version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    target-branch: develop
    commit-message:
      prefix: chore

  # L'ADR 0001 épingle des versions précises. Sans signal, elles vieillissent.
  - package-ecosystem: cargo
    directory: /pipeline
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    target-branch: develop
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    target-branch: develop
    commit-message:
      prefix: chore
